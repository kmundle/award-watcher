name: Check award pages

on:
  schedule:
    - cron: '0 12 * * *'   # every day at 12:00 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pages and deadlines
        run: python3 check_pages.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Save results
        run: |
          git config user.name "award-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state.json snapshots
          git diff --cached --quiet || (git commit -m "Update page checks" && git push)
